<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEPSE Screener — Trade With Vibes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap');

:root{
  --color-background-primary:#0a1220;
  --color-background-secondary:#0f1b2e;
  --color-background-info:#132a3f;
  --color-text-primary:#dce6f0;
  --color-text-secondary:#7c93ab;
  --color-text-tertiary:#4a6178;
  --color-text-info:#7ec8f7;
  --color-border-secondary:#1e3350;
  --color-border-tertiary:#182840;
  --border-radius-md:6px;
  --border-radius-lg:10px;
  --font-sans:'Chakra Petch',sans-serif;
}

body{background:var(--color-background-primary);margin:0;padding:0 10px;}
</style>
</head>
<body>

<style>
*{box-sizing:border-box;margin:0;padding:0}
#app{padding:.75rem 0;font-family:var(--font-sans)}
.topbar{display:flex;align-items:center;gap:7px;margin-bottom:.75rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:7px;padding:5px 10px;background:#0a1628;border-radius:var(--border-radius-md);flex-shrink:0}
.logo span{color:#fff;font-size:11px;font-weight:600;letter-spacing:.06em}
.logo i{color:#e8b84b;font-size:14px}
.qml-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;background:linear-gradient(135deg,#1a3a5c,#0d5c8f);border-radius:var(--border-radius-md);font-size:11px;color:#7ec8f7;font-weight:500;cursor:pointer;border:0.5px solid #1e5a8a;text-decoration:none;flex-shrink:0;transition:opacity .15s}
.qml-btn:hover{opacity:.85}
.qml-btn i{font-size:12px}
.sw{flex:1;min-width:120px;display:flex;align-items:center;gap:7px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:6px 10px}
.sw input{flex:1;border:none;outline:none;background:transparent;font-size:12px;color:var(--color-text-primary)}
.sw input::placeholder{color:var(--color-text-tertiary)}
.filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.6rem}
.fg{display:flex;align-items:center;gap:3px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:4px 8px;font-size:10px;color:var(--color-text-secondary)}
.fg select{border:none;outline:none;background:transparent;font-size:10px;color:#f5c518;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;font-family:var(--font-sans);max-width:125px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.45rem}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--color-background-info);color:var(--color-text-info);border-radius:999px;font-size:9px;padding:2px 7px;font-weight:500}
.chip button{border:none;background:none;cursor:pointer;color:inherit;font-size:11px;line-height:1;padding:0}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.45rem}
.rh span{font-size:10px;color:var(--color-text-secondary)}
.ss{border:none;outline:none;background:transparent;font-size:10px;color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-sans)}
.sm{display:flex;gap:8px;margin-bottom:.6rem;flex-wrap:wrap}
.smc{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.35rem .7rem}
.smc .sv{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.smc .sl{color:var(--color-text-secondary);font-size:9px}
.tw{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead tr{background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
th{padding:6px 7px;font-size:9px;font-weight:500;color:var(--color-text-secondary);text-align:left;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--color-text-primary)}
th:nth-child(1){width:13%}th:nth-child(2){width:9%}th:nth-child(3){width:8%}th:nth-child(4){width:8%}th:nth-child(5){width:15%}th:nth-child(6){width:7%}th:nth-child(7){width:7%}th:nth-child(8){width:7%}th:nth-child(9){width:26%}
td{padding:6px 7px;font-size:10px;color:var(--color-text-primary);border-bottom:0.5px solid var(--color-border-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.sym{font-weight:600;font-size:10px;letter-spacing:.03em}
.pos{color:#1D9E75;font-weight:500}.neg{color:#D85A30;font-weight:500}.neu{color:var(--color-text-tertiary)}
.bdg{display:inline-block;padding:1px 5px;border-radius:999px;font-size:8px;font-weight:500}
.bw{background:var(--color-background-secondary);border-radius:2px;height:3px;width:100%;margin-top:2px;overflow:hidden}
.bf{height:3px;border-radius:2px}
.pbv{display:inline-block;padding:1px 4px;border-radius:3px;font-size:8px;font-weight:600}
.pgr{display:flex;align-items:center;gap:7px;padding:.5rem 0;justify-content:center}
.pgr button{border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:3px 8px;font-size:10px;cursor:pointer;color:var(--color-text-primary);font-family:var(--font-sans)}
.pgr button:disabled{opacity:.35;cursor:default}
.pgr .pi{font-size:10px;color:var(--color-text-secondary)}
.nr{padding:2rem;text-align:center;color:var(--color-text-tertiary);font-size:11px}
</style>
<div id="app">
<div class="topbar">
  <div class="logo"><i class="ti ti-chart-candle"></i><span>NEPSE SCREENER</span></div>
  <label class="qml-btn" style="background:linear-gradient(135deg,#1a5c3a,#0d8f5c);border-color:#1e8a5a;color:#7ef7c8;cursor:pointer;" title="Import live scrip CSV (Symbol, LTP, Point Change, % Change, Open, High, Low, Volume, Prev Close) to refresh today's LTP for all matching scrips">
    <i class="ti ti-upload"></i>Import Live CSV
    <input type="file" accept=".csv" onchange="importScreenerCSV(this.files[0])" style="display:none;">
  </label>
  <span id="screener-csv-status" style="font-size:9px;color:var(--color-text-secondary);white-space:nowrap;"></span>
  <button class="qml-btn" style="background:linear-gradient(135deg,#5c3a1a,#8f5c0d);border-color:#8a5a1e;color:#f7c87e;" onclick="exportScreenerExcel()" title="Export the current (filtered/sorted) screener view as an Excel file">
    <i class="ti ti-file-spreadsheet"></i>Export Excel
  </button>
  <button class="qml-btn" style="background:linear-gradient(135deg,#3a1a5c,#5c0d8f);border-color:#5a1e8a;color:#c87ef7;" onclick="bakeScreener()" title="Bakes today's imported live data into a fresh copy of this whole Screener page — upload that file so every visitor sees today's data, not just you">
    <i class="ti ti-device-floppy"></i>Bake &amp; Download
  </button>
  <button class="qml-btn" style="background:linear-gradient(135deg,#1a3a5c,#0d5c8f);border-color:#1e5a8a;color:#7ec8f7;" onclick="shareScreenerSummary()" title="Share today's top gainers/losers as text">
    <i class="ti ti-share-2"></i>Share
  </button>
  <a class="qml-btn" href="https://qml-v2.tiiny.site" target="_blank" onclick="if(window.parent!==window){window.parent.postMessage({type:'gotoTab',tab:'qml'},'*');return false;}"><i class="ti ti-external-link"></i>QML Dashboard</a>
  <div class="sw"><i class="ti ti-search" style="font-size:13px;color:var(--color-text-secondary)"></i>
    <input type="text" id="q" placeholder="Search symbol…" oninput="go()">
  </div>
</div>
<div class="filters">
  <div class="fg"><i class="ti ti-building" style="font-size:11px"></i>
    <select id="f-sec" onchange="go()"><option value="">All Sectors</option><option>Commercial Banks</option><option>Development Banks</option><option>Finance</option><option>Hydropower</option><option>Life Insurance</option><option>Non-Life Insurance</option><option>Microfinance</option><option>Mutual Funds</option><option>Debentures</option><option>Manufacturing</option><option>Hotels & Tourism</option><option>Infrastructure</option><option>Others</option><option value="Unclassified" style="color:#f5c518;">\u26a0 Unclassified</option></select>
    <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--color-text-secondary);cursor:pointer;padding:5px 8px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);">
      <input type="checkbox" id="f-flagged-only" onchange="go()"> Flagged only <span id="flag-total" style="color:var(--color-text-info);"></span>
    </label>
    <i class="ti ti-chevron-down" style="font-size:9px"></i>
  </div>
  <div class="fg"><i class="ti ti-trending-up" style="font-size:11px"></i>
    <select id="f-chg" onchange="go()"><option value="">Any Move</option><option value="up">Gainers</option><option value="down">Losers</option><option value="big">Big Drop (&lt;-3%)</option><option value="surge">Surge (&gt;3%)</option></select>
    <i class="ti ti-chevron-down" style="font-size:9px"></i>
  </div>
  <div class="fg"><i class="ti ti-coin" style="font-size:11px"></i>
    <select id="f-ltp" onchange="go()"><option value="">Any Price</option><option value="u200">Under Rs 200</option><option value="200-500">Rs 200-500</option><option value="500-1000">Rs 500-1K</option><option value="1000p">Over Rs 1K</option></select>
    <i class="ti ti-chevron-down" style="font-size:9px"></i>
  </div>
  <div class="fg"><i class="ti ti-book-2" style="font-size:11px"></i>
    <select id="f-pbv" onchange="go()"><option value="">Any P/BV</option><option value="u1">Below Book</option><option value="1-2">1x-2x</option><option value="2-5">2x-5x</option><option value="5p">&gt;5x</option></select>
    <i class="ti ti-chevron-down" style="font-size:9px"></i>
  </div>
  <div class="fg"><i class="ti ti-activity" style="font-size:11px"></i>
    <select id="f-52" onchange="go()"><option value="">52W Any</option><option value="nearhi">Near High</option><option value="nearlow">Near Low</option><option value="mid">Mid Range</option></select>
    <i class="ti ti-chevron-down" style="font-size:9px"></i>
  </div>
  <div class="fg"><i class="ti ti-flame" style="font-size:11px"></i>
    <select id="f-vol" onchange="go()"><option value="">Any Volume</option><option value="h">&gt;50K</option><option value="m">10K-50K</option><option value="l">&lt;10K</option></select>
    <i class="ti ti-chevron-down" style="font-size:9px"></i>
  </div>
</div>
<div class="chips" id="chips"></div>
<div class="sm" id="summary"></div>
<div class="rh"><span id="cnt"></span>
  <div style="display:flex;align-items:center;gap:4px">
    <span style="font-size:10px;color:var(--color-text-secondary)">Sort</span>
    <select class="ss" id="sort" onchange="go()">
      <option value="vol">Volume</option><option value="chg">Change %</option>
      <option value="ltp">LTP</option><option value="pbv">P/BV</option>
      <option value="range">52W Pos</option><option value="sym">Symbol</option>
    </select>
  </div>
</div>
<div class="tw"><table>
  <thead><tr>
    <th style="width:24px;"><input type="checkbox" id="chk-all" onchange="toggleAllFlag(this.checked)" title="Select all on this page"></th>
    <th onclick="setSort('sym')">Symbol</th>
    <th onclick="setSort('ltp')">LTP</th>
    <th onclick="setSort('chg')">Chg%</th>
    <th onclick="setSort('vol')">Vol</th>
    <th>52W Range</th>
    <th onclick="setSort('pbv')">BVPS</th>
    <th onclick="setSort('pbv')">P/BV</th>
    <th>Open</th><th>Sector</th>
  </tr></thead>
  <tbody id="tbody"></tbody>
</table></div>
<div id="bulk-bar" style="display:none;margin-top:8px;padding:8px 10px;background:var(--color-background-info);border-radius:var(--border-radius-md);align-items:center;gap:8px;flex-wrap:wrap;">
  <span id="bulk-count" style="font-size:11px;color:var(--color-text-primary);font-weight:600;"></span>
  <span style="font-size:11px;color:var(--color-text-secondary);">Move to:</span>
  <select id="bulk-sector-pick" style="padding:4px 8px;border-radius:6px;background:var(--color-background-secondary);color:var(--color-text-primary);border:1px solid var(--color-border-secondary);font-size:11px;"></select>
  <button class="qml-btn" style="background:linear-gradient(135deg,#1a5c3a,#0d8f5c);border-color:#1e8a5a;color:#7ef7c8;" onclick="applyBulkSector()">Apply</button>
  <button class="qml-btn" style="background:transparent;border-color:var(--color-border-secondary);color:var(--color-text-secondary);" onclick="clearFlags()">Clear selection</button>
</div>
<div class="pgr" id="pgr"></div>
</div>

function loadOverrides(){try{return JSON.parse(localStorage.getItem('twv_sector_override')||'{}');}catch(e){return{};}}
function saveOverride(sym,sec){var o=loadOverrides();if(sec)o[sym]=sec;else delete o[sym];localStorage.setItem('twv_sector_override',JSON.stringify(o));}
var SECOV=loadOverrides();
function getSec(s){
  if(SECOV[s])return SECOV[s];
  if(/D8[2-9]$|D9[0-9]$|D2085$|D2089$|D209[0-9]$|D208[0-9]$|EB89$|BD8[0-9]|BD9[0-9]|BD20|D87\/88$|D86\/87$|D84\/85$|D85\/86$|D84$|D85$|D86$|D87$|D88$|D89$|D83$|D90$|D91$/.test(s))return'Debentures';
  return SM[s]||'Unclassified';
}
function goToScrip(sym){if(window.parent!==window){window.parent.postMessage({type:'gotoScrip',sym:sym},'*');}}
function loadFlags(){try{return JSON.parse(localStorage.getItem('twv_flagged_scrips')||'{}');}catch(e){return{};}}
function saveFlags(){localStorage.setItem('twv_flagged_scrips',JSON.stringify(FLAGGED));}
var FLAGGED=loadFlags();
function toggleFlag(sym,on){
  if(on)FLAGGED[sym]=true;else delete FLAGGED[sym];
  saveFlags();updateBulkBar();
}
function toggleAllFlag(on){
  getFilteredStocks().forEach(function(s){if(on)FLAGGED[s.sym]=true;else delete FLAGGED[s.sym];});
  saveFlags();go();
}
function clearFlags(){FLAGGED={};saveFlags();go();}
function updateBulkBar(){
  var n=Object.keys(FLAGGED).length;
  var bar=document.getElementById('bulk-bar');
  var cnt=document.getElementById('bulk-count');
  var ft=document.getElementById('flag-total');
  if(ft)ft.textContent=n?('('+n+')'):'';
  if(!bar)return;
  if(n>0){
    bar.style.display='flex';
    cnt.textContent=n+' scrip'+(n>1?'s':'')+' selected';
    var pick=document.getElementById('bulk-sector-pick');
    if(pick&&!pick.dataset.filled){
      pick.innerHTML=Object.keys(SC).map(function(s){return'<option>'+s+'</option>';}).join('');
      pick.dataset.filled='1';
    }
  } else bar.style.display='none';
}
function applyBulkSector(){
  var sector=document.getElementById('bulk-sector-pick').value;
  if(!sector)return;
  Object.keys(FLAGGED).forEach(function(sym){
    saveOverride(sym,sector);
    STOCKS.forEach(function(s){if(s.sym===sym)s.sec=sector;});
  });
  clearFlags();
}
function editSector(sym,ev){
  ev.stopPropagation();
  var secs=Object.keys(SC);
  var cur=getSec(sym);
  var pick=prompt('Sector for '+sym+':\n'+secs.map(function(s,i){return(i+1)+') '+s;}).join('\n')+'\n\nType number or exact name:',cur);
  if(pick===null)return;
  var n=parseInt(pick,10);
  var chosen=(!isNaN(n)&&secs[n-1])?secs[n-1]:secs.find(function(s){return s.toLowerCase()===pick.trim().toLowerCase();});
  if(!chosen){alert('Not a valid sector.');return;}
  saveOverride(sym,chosen);SECOV=loadOverrides();
  STOCKS.forEach(function(s){if(s.sym===sym)s.sec=chosen;});
  go();
}

function bakeScreener(){
  saveScreenerLive();
  var keys=['twv_screener_live','twv_sector_override'];
  var seed={};
  keys.forEach(function(k){var v=localStorage.getItem(k);if(v!==null)seed[k]=v;});
  var html=document.documentElement.outerHTML;
  var seedScript='<script>(function(){var seed='+JSON.stringify(seed)+';for(var k in seed){try{localStorage.setItem(k,seed[k]);}catch(e){}}})();<\/script>\n</head>';
  html=html.replace('</head>',seedScript);
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download='screener_page_'+new Date().toISOString().split('T')[0]+'.html';
  a.click();
  var st=document.getElementById('screener-csv-status');
  st.textContent='\u2713 Screener baked \u2014 upload this to replace screener_page.html';
  st.style.color='#c87ef7';
}
function saveScreenerLive(){
  try{
    var out={};
    STOCKS.forEach(function(s){out[s.sym]={ltp:s.ltp,chg:s.chg,vol:s.vol,open:s.open,hi52:s.hi52,lo52:s.lo52};});
    localStorage.setItem('twv_screener_live',JSON.stringify({data:out,date:new Date().toISOString().split('T')[0]}));
  }catch(e){}
}
function loadScreenerLive(){
  try{
    var raw=localStorage.getItem('twv_screener_live');
    if(!raw)return;
    var saved=JSON.parse(raw);
    var bySym={};
    STOCKS.forEach(function(s){bySym[s.sym]=s;});
    var count=0;
    Object.keys(saved.data).forEach(function(sym){
      if(bySym[sym]){
        var d=saved.data[sym];
        bySym[sym].ltp=d.ltp;bySym[sym].chg=d.chg;bySym[sym].vol=d.vol;bySym[sym].open=d.open;
        if(d.hi52)bySym[sym].hi52=d.hi52;
        if(d.lo52)bySym[sym].lo52=d.lo52;
        count++;
      }
    });
    if(count>0){
      var status=document.getElementById('screener-csv-status');
      status.textContent='\u2713 Restored last data ('+saved.date+', '+count+' scrips)';
      status.style.color='#7ec8f7';
    }
  }catch(e){}
}
function autoFetchScreenerCSV(){
  var status=document.getElementById('screener-csv-status');
  fetch('today.csv',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('today.csv not found ('+r.status+')');
    return r.text();
  }).then(function(text){
    var lines=text.split('\n').filter(function(l){return l.trim();});
    var header=splitScreenerCSVLine(lines[0]).map(function(c){return c.trim().toLowerCase();});
    var col={};header.forEach(function(h,i){if(h&&col[h]===undefined)col[h]=i;});
    var symI=col['symbol'],ltpI=col['last updated price'],prevI=col['previous day close price'],
        volI=col['total traded quantity'],hi52I=col['fifty two week high'],lo52I=col['fifty two week low'],
        openI=col['open price'];
    if(symI===undefined||ltpI===undefined){status.textContent='\u26a0 today.csv missing expected columns';status.style.color='#e74c3c';return;}
    var bySym={};
    STOCKS.forEach(function(s){bySym[s.sym]=s;});
    var count=0;
    lines.slice(1).forEach(function(line){
      var p=splitScreenerCSVLine(line).map(function(c){return c.trim();});
      var sym=(p[symI]||'').toUpperCase();
      if(!sym||!bySym[sym])return;
      var ltp=parseFloat(p[ltpI]);
      var prev=parseFloat(p[prevI]);
      var vol=parseFloat(p[volI]);
      var hi52=parseFloat(p[hi52I]);
      var lo52=parseFloat(p[lo52I]);
      var open=parseFloat(p[openI]);
      if(isNaN(ltp))return;
      var s=bySym[sym];
      s.ltp=ltp;
      if(!isNaN(prev)&&prev>0)s.chg=Math.round((ltp-prev)/prev*10000)/100;
      if(!isNaN(vol))s.vol=vol;
      if(!isNaN(hi52)&&hi52>0)s.hi52=hi52;
      if(!isNaN(lo52)&&lo52>0)s.lo52=lo52;
      if(!isNaN(open))s.open=open;
      count++;
    });
    if(count>0){
      status.textContent='\u2713 Live data loaded ('+count+' scrips, today.csv)';
      status.style.color='#1D9E75';
      saveScreenerLive();
      saveVolSnapshot();
      go();
    } else {
      status.textContent='\u26a0 today.csv had no matching symbols';
      status.style.color='#e74c3c';
    }
  }).catch(function(err){
    status.textContent='\u26a0 Auto-fetch failed ('+err.message+') \u2014 showing last saved/baked data';
    status.style.color='#e0a030';
  });
}
function loadVolHistory(){
  try{return JSON.parse(localStorage.getItem('twv_volume_history')||'[]');}catch(e){return[];}
}
function saveVolSnapshot(){
  var hist=loadVolHistory();
  var today=new Date().toISOString().split('T')[0];
  var vols={};
  STOCKS.forEach(function(s){vols[s.sym]=s.vol;});
  // replace today's entry if it already exists (re-import same day), else append
  var idx=hist.findIndex(function(h){return h.date===today;});
  if(idx>-1)hist[idx]={date:today,vols:vols};
  else hist.push({date:today,vols:vols});
  if(hist.length>30)hist=hist.slice(hist.length-30); // keep a rolling ~30-day window
  localStorage.setItem('twv_volume_history',JSON.stringify(hist));
}
function getRVOL(sym,todayVol){
  var hist=loadVolHistory();
  var today=new Date().toISOString().split('T')[0];
  var past=hist.filter(function(h){return h.date!==today&&h.vols[sym]!==undefined;});
  if(past.length<5)return{rvol:null,days:past.length}; // not enough baseline yet
  var sum=0;past.forEach(function(h){sum+=h.vols[sym];});
  var avg=sum/past.length;
  return{rvol:avg>0?todayVol/avg:null,days:past.length};
}
function rvolBadge(sym,vol){
  var r=getRVOL(sym,vol);
  if(r.rvol===null)return'<span title="Building baseline \u2014 '+r.days+'/5+ days collected" style="font-size:8px;color:#7ec8f7;">baseline '+r.days+'/5d</span>';
  if(r.rvol>1.5)return'<span title="RVOL '+r.rvol.toFixed(2)+'x \u2014 well above this scrip average volume" style="font-size:8px;color:#1D9E75;font-weight:700;">\u2713 '+r.rvol.toFixed(1)+'x</span>';
  if(r.rvol<0.5)return'<span title="RVOL '+r.rvol.toFixed(2)+'x \u2014 thin vs this scrip average, signals here carry more noise risk" style="font-size:8px;color:#e74c3c;font-weight:700;">\u26a0 '+r.rvol.toFixed(1)+'x</span>';
  return'<span title="RVOL '+r.rvol.toFixed(2)+'x \u2014 normal for this scrip" style="font-size:8px;color:var(--color-text-secondary);">~ '+r.rvol.toFixed(1)+'x</span>';
}
function splitScreenerCSVLine(line){
  var out=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){out.push(cur);cur='';}
    else{cur+=ch;}
  }
  out.push(cur);
  return out;
}

      for(var i=0;i<Math.min(lines.length,6);i++){
        var cells=splitScreenerCSVLine(lines[i]).map(function(c){return c.trim().toLowerCase();});
        if(cells.indexOf('symbol')>-1){headerIdx=i;header=cells;break;}
      }
      if(headerIdx===-1){status.textContent='\u26a0 No Symbol column found';status.style.color='#e74c3c';return;}
      var col={};header.forEach(function(h,i){if(h&&col[h]===undefined)col[h]=i;});
      // "52 weeks high/low" appear a second time further along the row \u2014 find their LAST occurrence, not first
      var hi52I=-1,lo52I=-1;
      header.forEach(function(h,i){if(h==='52 weeks high')hi52I=i;if(h==='52 weeks low')lo52I=i;});
      var symI=col['symbol'],ltpI=col['ltp'],pctI=col['% change'],openI=col['open'],volI=col['volume'];
      var count=0;
      var bySym={};
      STOCKS.forEach(function(s){bySym[s.sym]=s;});
      lines.slice(headerIdx+1).forEach(function(line){
        var p=splitScreenerCSVLine(line).map(function(c){return c.replace(/,/g,'');});
        var sym=(p[symI]||'').trim().toUpperCase();
        if(!sym||!bySym[sym])return;
        var ltp=parseFloat(p[ltpI]);
        var pct=parseFloat(p[pctI]);
        var open=parseFloat(p[openI]);
        var vol=parseFloat(p[volI]);
        var hi52=hi52I>-1?parseFloat(p[hi52I]):NaN;
        var lo52=lo52I>-1?parseFloat(p[lo52I]):NaN;
        if(isNaN(ltp))return;
        var s=bySym[sym];
        s.ltp=ltp;
        if(!isNaN(pct))s.chg=pct;
        if(!isNaN(open))s.open=open;
        if(!isNaN(vol))s.vol=vol;
        if(!isNaN(hi52)&&hi52>0)s.hi52=hi52;
        if(!isNaN(lo52)&&lo52>0)s.lo52=lo52;
        count++;
      });
      if(count>0){
        status.textContent='\u2713 '+count+' scrips refreshed with today\u2019s LTP';
        status.style.color='#1D9E75';
        saveScreenerLive();
        saveVolSnapshot();
        go();
      } else {
        status.textContent='\u26a0 No matching symbols found';
        status.style.color='#e74c3c';
      }
    }catch(err){
      status.textContent='\u26a0 '+err.message;
      status.style.color='#e74c3c';
    }
  };
  reader.readAsText(file);
}
function getFilteredStocks(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const sec=document.getElementById('f-sec').value,chg=document.getElementById('f-chg').value;
  const ltp=document.getElementById('f-ltp').value,w=document.getElementById('f-52').value;
  const vol=document.getElementById('f-vol').value,pbv=document.getElementById('f-pbv').value;
  const flaggedOnly=document.getElementById('f-flagged-only').checked;
  const sk=document.getElementById('sort').value||sortKey;
  let d=STOCKS.filter(s=>{
    if(flaggedOnly&&!FLAGGED[s.sym])return false;
    if(q&&!s.sym.toLowerCase().includes(q))return false;
    if(sec&&s.sec!==sec)return false;
    if(chg==='up'&&s.chg<=0)return false;if(chg==='down'&&s.chg>=0)return false;
    if(chg==='big'&&s.chg>-3)return false;if(chg==='surge'&&s.chg<3)return false;
    if(ltp&&ltpB(s.ltp)!==ltp)return false;
    const p=w52p(s.ltp,s.hi52,s.lo52);
    if(w==='nearhi'&&p<0.9)return false;if(w==='nearlow'&&p>0.1)return false;
    if(w==='mid'&&(p<0.3||p>0.7))return false;
    if(vol==='h'&&s.vol<50000)return false;if(vol==='m'&&(s.vol<10000||s.vol>=50000))return false;if(vol==='l'&&s.vol>=10000)return false;
    if(pbv){const b=pbvBkt(s.ltp,s.bvps);if(b!==pbv)return false;}
    return true;
  });
  if(sk==='sym')d.sort((a,b)=>a.sym.localeCompare(b.sym));
  else if(sk==='ltp')d.sort((a,b)=>b.ltp-a.ltp);
  else if(sk==='chg')d.sort((a,b)=>b.chg-a.chg);
  else if(sk==='range')d.sort((a,b)=>w52p(b.ltp,b.hi52,b.lo52)-w52p(a.ltp,a.hi52,a.lo52));
  else if(sk==='pbv')d.sort((a,b)=>(a.bvps?a.ltp/a.bvps:99)-(b.bvps?b.ltp/b.bvps:99));
  else d.sort((a,b)=>b.vol-a.vol);
  return d;
}
function shareScreenerSummary(){
  const d=getFilteredStocks();
  const gainers=[...d].sort((a,b)=>b.chg-a.chg).slice(0,3);
  const losers=[...d].sort((a,b)=>a.chg-b.chg).slice(0,3);
  const g=(s)=>s.sym+' '+(s.chg>=0?'+':'')+s.chg.toFixed(2)+'%';
  const text='\ud83d\udcca NEPSE Screener \u2014 '+new Date().toISOString().split('T')[0]+'\n\n'+
    '\ud83d\udfe2 Top Gainers\n'+gainers.map(g).join('\n')+'\n\n'+
    '\ud83d\udd34 Top Losers\n'+losers.map(g).join('\n')+'\n\n'+
    'Trade With Vibes \u2014 nepsevibes.com';
  if(navigator.share){
    navigator.share({title:'NEPSE Screener Summary',text:text}).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      const st=document.getElementById('screener-csv-status');
      st.textContent='\u2713 Summary copied \u2014 ready to share';
      st.style.color='#1D9E75';
    });
  } else {
    prompt('Copy this:',text);
  }
}
function exportScreenerExcel(){
  if(typeof XLSX==='undefined'){document.getElementById('screener-csv-status').textContent='\u26a0 Excel library not loaded';return;}
  const d=getFilteredStocks();
  const rows=[['TRADE WITH VIBES \u2014 NEPSE Screener Export',new Date().toISOString().split('T')[0]],[],
    ['Symbol','LTP','Chg%','Volume','52W Low','52W High','BVPS','P/BV','Open','Sector']];
  d.forEach(s=>{
    rows.push([s.sym,s.ltp,s.chg,s.vol,s.lo52,s.hi52,s.bvps||'',s.bvps?(s.ltp/s.bvps).toFixed(2):'',s.open,s.sec]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:10},{wch:10},{wch:8},{wch:10},{wch:10},{wch:10},{wch:8},{wch:8},{wch:10},{wch:20}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Screener');
  XLSX.writeFile(wb,'TWV_Screener_'+new Date().toISOString().split('T')[0]+'.xlsx');
  const st=document.getElementById('screener-csv-status');
  st.textContent='\u2713 '+d.length+' scrips exported to Excel';
  st.style.color='#1D9E75';
}
function go(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const sec=document.getElementById('f-sec').value,chg=document.getElementById('f-chg').value;
  const ltp=document.getElementById('f-ltp').value,w=document.getElementById('f-52').value;
  const vol=document.getElementById('f-vol').value,pbv=document.getElementById('f-pbv').value;
  const flaggedOnly=document.getElementById('f-flagged-only').checked;
  const sk=document.getElementById('sort').value||sortKey;
  const flagCount=Object.keys(FLAGGED).filter(k=>FLAGGED[k]).length;
  document.getElementById('flag-total').textContent=flagCount?'('+flagCount+')':'';
  let d=STOCKS.filter(s=>{
    if(flaggedOnly&&!FLAGGED[s.sym])return false;
    if(q&&!s.sym.toLowerCase().includes(q))return false;
    if(sec&&s.sec!==sec)return false;
    if(chg==='up'&&s.chg<=0)return false;if(chg==='down'&&s.chg>=0)return false;
    if(chg==='big'&&s.chg>-3)return false;if(chg==='surge'&&s.chg<3)return false;
    if(ltp&&ltpB(s.ltp)!==ltp)return false;
    const p=w52p(s.ltp,s.hi52,s.lo52);
    if(w==='nearhi'&&p<0.9)return false;if(w==='nearlow'&&p>0.1)return false;
    if(w==='mid'&&(p<0.3||p>0.7))return false;
    if(vol==='h'&&s.vol<50000)return false;if(vol==='m'&&(s.vol<10000||s.vol>=50000))return false;if(vol==='l'&&s.vol>=10000)return false;
    if(pbv){const b=pbvBkt(s.ltp,s.bvps);if(b!==pbv)return false;}
    return true;
  });
  if(sk==='sym')d.sort((a,b)=>a.sym.localeCompare(b.sym));
  else if(sk==='ltp')d.sort((a,b)=>b.ltp-a.ltp);
  else if(sk==='chg')d.sort((a,b)=>b.chg-a.chg);
  else if(sk==='range')d.sort((a,b)=>w52p(b.ltp,b.hi52,b.lo52)-w52p(a.ltp,a.hi52,a.lo52));
  else if(sk==='pbv')d.sort((a,b)=>(a.bvps?a.ltp/a.bvps:99)-(b.bvps?b.ltp/b.bvps:99));
  else d.sort((a,b)=>b.vol-a.vol);
  const tot=d.length,pages=Math.max(1,Math.ceil(tot/PER));
  if(pg>pages)pg=1;
  const sl=d.slice((pg-1)*PER,pg*PER);
  const g=d.filter(s=>s.chg>0).length,l=d.filter(s=>s.chg<0).length;
  const avg=(d.reduce((a,s)=>a+s.chg,0)/Math.max(1,d.length)).toFixed(2);
  document.getElementById('summary').innerHTML=`<div class="smc"><div class="sv">${tot}</div><div class="sl">Scrips</div></div><div class="smc"><div class="sv" style="color:#1D9E75">${g}</div><div class="sl">Gainers</div></div><div class="smc"><div class="sv" style="color:#D85A30">${l}</div><div class="sl">Losers</div></div><div class="smc"><div class="sv" style="${parseFloat(avg)>=0?'color:#1D9E75':'color:#D85A30'}">${parseFloat(avg)>=0?'+':''}${avg}%</div><div class="sl">Avg Chg</div></div>`;
  const tbody=document.getElementById('tbody');
  if(!sl.length)tbody.innerHTML=`<tr><td colspan="9"><div class="nr">No scrips match</div></td></tr>`;
  else tbody.innerHTML=sl.map(s=>{
    const pos=Math.round(w52p(s.ltp,s.hi52,s.lo52)*100);
    const cls=s.chg>0?'pos':s.chg<0?'neg':'neu',sign=s.chg>0?'+':'';
    const[bg,fg]=SC[s.sec]||['#F1EFE8','#5F5E5A'];
    const bc=pos>70?'#1D9E75':pos<30?'#D85A30':'#185FA5';
    let bvCell='<span style="color:var(--color-text-tertiary)">—</span>',pbvCell='<span style="color:var(--color-text-tertiary)">—</span>';
    if(s.bvps){const r=s.ltp/s.bvps;const[pb,pf]=pbvCol(r);bvCell=`${s.bvps.toLocaleString()}`;pbvCell=`<span class="pbv" style="background:${pb};color:${pf}">${r.toFixed(1)}x</span>`;}
    return`<tr class="clickrow" onclick="goToScrip('${s.sym}')" style="cursor:pointer"><td onclick="event.stopPropagation()"><input type="checkbox" ${FLAGGED[s.sym]?'checked':''} onchange="toggleFlag('${s.sym}',this.checked)"></td><td><span class="sym">${s.sym}</span></td><td style="font-weight:500">${s.ltp.toLocaleString()}</td><td class="${cls}">${sign}${s.chg.toFixed(2)}%</td><td style="color:var(--color-text-secondary)">${fv(s.vol)}<br>${rvolBadge(s.sym,s.vol)}</td><td><div style="font-size:9px;color:var(--color-text-secondary)">${s.lo52.toLocaleString()} – ${s.hi52.toLocaleString()}</div><div class="bw"><div class="bf" style="width:${pos}%;background:${bc}"></div></div></td><td style="font-size:9px;color:var(--color-text-secondary)">${bvCell}</td><td>${pbvCell}</td><td style="color:var(--color-text-secondary)">${s.open.toLocaleString()}</td><td><span class="bdg" style="background:${bg};color:${fg};cursor:pointer" onclick="editSector('${s.sym}',event)" title="Click to edit sector">${s.sec} &#9998;</span></td></tr>`;
  }).join('');
  document.getElementById('cnt').textContent=`${tot} scrips · page ${pg}/${pages}`;
  document.getElementById('pgr').innerHTML=pages>1?`<button onclick="gp(1)" ${pg===1?'disabled':''}>«</button><button onclick="gp(${pg-1})" ${pg===1?'disabled':''}>‹</button><span class="pi">Page ${pg} of ${pages}</span><button onclick="gp(${pg+1})" ${pg===pages?'disabled':''}>›</button><button onclick="gp(${pages})" ${pg===pages?'disabled':''}>»</button>`:'';
  const chips=[];
  if(sec)chips.push({l:`Sector: ${sec}`,c:()=>{document.getElementById('f-sec').value='';go()}});
  if(chg)chips.push({l:{up:'Gainers',down:'Losers',big:'Big Drop',surge:'Surge'}[chg],c:()=>{document.getElementById('f-chg').value='';go()}});
  if(ltp)chips.push({l:`Price: ${ltp}`,c:()=>{document.getElementById('f-ltp').value='';go()}});
  if(pbv)chips.push({l:{u1:'Below Book','1-2':'P/BV 1-2x','2-5':'P/BV 2-5x','5p':'>5x'}[pbv],c:()=>{document.getElementById('f-pbv').value='';go()}});
  if(w)chips.push({l:w==='nearhi'?'Near 52W High':w==='nearlow'?'Near 52W Low':'Mid Range',c:()=>{document.getElementById('f-52').value='';go()}});
  if(vol)chips.push({l:vol==='h'?'High Vol':vol==='m'?'Mid Vol':'Low Vol',c:()=>{document.getElementById('f-vol').value='';go()}});
  document.getElementById('chips').innerHTML=chips.map((_,i)=>`<span class="chip">${chips[i].l}<button onclick="cc(${i})">x</button></span>`).join('');
  window.__CC=chips.map(c=>c.c);
}
function gp(n){pg=n;go();}function cc(i){window.__CC[i]();}
